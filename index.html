<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Link</title>
<style>
  :root {
    --ink: #1c2321;
    --paper: #f7f5f0;
    --line: #d8d3c7;
    --accent: #3d5a4c;
    --accent-hover: #2e4739;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: 620px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  p.lead {
    margin: 0 0 32px;
    color: #5b5b52;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 0.8rem;
    color: #5b5b52;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    min-height: 160px;
    padding: 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.9rem;
    color: var(--ink);
    resize: vertical;
    line-height: 1.5;
  }

  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  button {
    margin-top: 16px;
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 0.9rem;
    font-family: var(--sans);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .result-block {
    margin-top: 36px;
    border-top: 1px solid var(--line);
    padding-top: 24px;
    display: none;
  }

  .result-block.visible { display: block; }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .result-header label { margin: 0; }

  .copy-btn {
    margin: 0;
    padding: 5px 12px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
    font-size: 0.78rem;
  }

  .copy-btn:hover { background: #fff; border-color: var(--accent); }

  .result {
    padding: 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 0.92rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .result a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 2px;
  }

  .result a:hover { text-decoration-color: var(--accent); }

  .empty-msg {
    color: #8a8578;
    font-size: 0.85rem;
    margin-top: 10px;
  }
</style>
</head>
<body>
<main>
  <h1>Text to Link</h1>
  <p class="lead">Colle du texte contenant des URL. Les liens seront détectés et rendus cliquables.</p>

  <label for="input">Texte source</label>
  <textarea id="input" placeholder="Colle ton texte ici, par exemple : Voir https://example.com pour plus d'infos."></textarea>

  <div>
    <button id="convert">Text to Link</button>
  </div>

  <div class="result-block" id="resultBlock">
    <div class="result-header">
      <label>Résultat</label>
      <button class="copy-btn" id="copyBtn">Copier le HTML</button>
    </div>
    <div class="result" id="result"></div>
    <p class="empty-msg" id="emptyMsg" style="display:none;">Aucune URL trouvée dans le texte.</p>
  </div>
</main>

<script>
  const urlRegex = /((https?:\/\/|www\.)[^\s<>"]+)/gi;

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function linkify(text) {
    const escaped = escapeHtml(text);
    let found = false;
    const linked = escaped.replace(urlRegex, (match) => {
      found = true;
      // strip trailing punctuation commonly caught by mistake
      const trailingPunct = /[.,!?;:)\]]+$/;
      let clean = match;
      let suffix = "";
      const m = match.match(trailingPunct);
      if (m) {
        suffix = m[0];
        clean = match.slice(0, -suffix.length);
      }
      const href = clean.startsWith("http") ? clean : "https://" + clean;
      return `<a href="${href}" target="_blank" rel="noopener noreferrer">${clean}</a>${suffix}`;
    });
    return { html: linked, found };
  }

  const input = document.getElementById("input");
  const convertBtn = document.getElementById("convert");
  const resultBlock = document.getElementById("resultBlock");
  const result = document.getElementById("result");
  const emptyMsg = document.getElementById("emptyMsg");
  const copyBtn = document.getElementById("copyBtn");

  convertBtn.addEventListener("click", () => {
    const text = input.value.trim();
    resultBlock.classList.add("visible");

    if (!text) {
      result.innerHTML = "";
      emptyMsg.style.display = "block";
      emptyMsg.textContent = "Colle du texte avant de convertir.";
      return;
    }

    const { html, found } = linkify(text);
    result.innerHTML = html;
    emptyMsg.style.display = found ? "none" : "block";
    if (!found) emptyMsg.textContent = "Aucune URL trouvée dans le texte.";
  });

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(result.innerHTML);
      const original = copyBtn.textContent;
      copyBtn.textContent = "Copié !";
      setTimeout(() => (copyBtn.textContent = original), 1500);
    } catch (e) {
      copyBtn.textContent = "Erreur";
    }
  });
</script>
</body>
</html>
